version: "3.3"

services:
  app:
    build:
      context: .
      target: app
    image: sanbenjamin-app:latest
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./database/database.sqlite:/var/www/html/database/database.sqlite
      - app-storage:/var/www/html/storage

  scheduler:
    build:
      context: .
      target: app
    image: sanbenjamin-app:latest
    restart: unless-stopped
    command: php artisan schedule:work --no-interaction
    env_file:
      - .env
    volumes:
      - ./database/database.sqlite:/var/www/html/database/database.sqlite
      - app-storage:/var/www/html/storage

  web:
    build:
      context: .
      target: web
    image: sanbenjamin-web:latest
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - app-storage:/var/www/html/storage:ro
    depends_on:
      - app

volumes:
  app-storage:
