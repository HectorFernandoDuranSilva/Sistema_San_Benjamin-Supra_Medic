version: "3.3"

services:
  app:
    image: sanbenjamin-app:latest
    restart: unless-stopped
    command: >
      sh -c 'mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs && chown -R www-data:www-data storage && chown www-data:www-data database && chmod 770 database && chmod 660 database/database.sqlite && exec php-fpm'
    env_file:
      - .env
    volumes:
      - ./database/database.sqlite:/var/www/html/database/database.sqlite
      - app-storage:/var/www/html/storage

  scheduler:
    image: sanbenjamin-app:latest
    restart: unless-stopped
    command: >
      sh -c 'mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs && chown -R www-data:www-data storage && chown www-data:www-data database && chmod 770 database && chmod 660 database/database.sqlite && exec php artisan schedule:work --no-interaction'
    env_file:
      - .env
    volumes:
      - ./database/database.sqlite:/var/www/html/database/database.sqlite
      - app-storage:/var/www/html/storage

  web:
    image: sanbenjamin-web:latest
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - app-storage:/var/www/html/storage:ro
    depends_on:
      - app

volumes:
  app-storage:
